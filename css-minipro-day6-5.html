<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 6 Task 5:</title>

<style>
   
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        padding: 30px;
    }

    .testimonial-section {
        max-width: 900px;
        margin: auto;
    }

    .testimonial-title {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 25px;
    }

    .testimonials {
        display: flex;
        gap: 20px; 
        flex-wrap: wrap;
    }

    .testimonial-card {
        background: #ffffff;             
        border: 2px solid #ddd;              
        border-radius: 10px;               
        padding: 20px;                       
        width: 30%;
        min-width: 260px;
    }

    .testimonial-card p {
        font-size: 16px;
        line-height: 1.4;
        margin-bottom: 15px;
    }

    .author {
        font-weight: bold;
        color: #444;
    }
</style>

</head>
<body>

<section class="testimonial-section">
    <div class="testimonial-title">What Our Customers Say</div>

    <div class="testimonials">

        <div class="testimonial-card">
            <p>"This product exceeded all my expectations! Amazing quality and service."</p>
            <div class="author">— Sarah Johnson</div>
        </div>

        <div class="testimonial-card">
            <p>"Fast delivery and excellent customer support. Highly recommend!"</p>
            <div class="author">— Michael Lee</div>
        </div>

        <div class="testimonial-card">
            <p>"A wonderful experience from start to finish. Will definitely buy again."</p>
            <div class="author">— Priya Sharma</div>
        </div>

    </div>
</section>

</body>
</html>
