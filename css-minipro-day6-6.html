<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 6 Task 6:</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 30px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }
    .team-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px; 
        padding: 10px;
    }
 .team-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: transform 0.3s ease-in-out;
    }

    .team-card:hover {
        transform: translateY(-5px);
    }

    .team-card img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
    }

    .team-card h3 {
        font-size: 18px;
        margin-bottom: 8px;
    }

    .team-card p {
        font-size: 14px;
        color: #666;
    }

</style>
</head>
<body>

<h1>Meet Our Team</h1>

<div class="team-container">

    <div class="team-card">
        <img src="men-ph.jpeg" alt="Team Member 1">
        <h3>Arun</h3>
        <p>Project Manager</p>
    </div>

    <div class="team-card">
        <img src="w-ph.jpeg" alt="Team Member 2">
        <h3>Sarah</h3>
        <p>UI/UX Designer</p>
    </div>

    <div class="team-card">
        <img src="men-ph.jpeg" alt="Team Member 3">
        <h3>Mukesh</h3>
        <p>Full-Stack Developer</p>
    </div>

    <div class="team-card">
        <img src="w-ph.jpeg"alt="Team Member 4">
        <h3>Sanjana</h3>
        <p>Marketing Specialist</p>
    </div>

</div>

</body>
</html>
