<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 6 Task 8:</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f6f6f6;
        padding: 30px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    table {
        width: 80%;
        margin: 20px auto 40px auto; 
        border-collapse: collapse;
        background: white;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    th, td {
        padding: 15px;
        border: 1px solid #ccc;
        text-align: center;
        font-size: 16px;
    }

    th {
        background: #333;
        color: white;
    }

    .highlight {
        background: #ffefc2;   
    }
</style>

</head>
<body>

<h1>Feature Comparison Table</h1>

<table>
    <tr>
        <th>Features</th>
        <th>Product A</th>
        <th>Product B</th>
    </tr>

    <tr>
        <td>Price</td>
        <td>Rs.4999</td>
        <td class="highlight">Rs.5999</td> 
    </tr>

    <tr>
        <td>Storage</td>
        <td class="highlight">50GB</td>
        <td>100GB</td>
    </tr>

    <tr>
        <td>Customer Support</td>
        <td>24/7 Support</td>
        <td class="highlight">Email Only</td>
    </tr>

    <tr>
        <td>Monthly Backups</td>
        <td>Yes</td>
        <td class="highlight">No</td>
    </tr>

</table>

</body>
</html>
